<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notícias</title>
<script type="application/tanden+json">
{
  "id": "noticias",
  "nome": "Notícias",
  "versao": "1.0.0",
  "api": 1,
  "autor": "Tanden",
  "icone": "N",
  "descricao": "Leitor de feeds RSS e Atom. Avisa quando chegam notícias novas e salva um artigo como nota, com imagens, para ler offline. As fontes ficam na nota Notícias/Fontes.md.",
  "tela": true,
  "fundo": true,
  "permissoes": ["rede", "avisos", "notas:ler:Notícias/", "notas:escrever:Notícias/"]
}
</script>
<style>
  :root { --r: 12px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--void); color: var(--ink); font: 14px/1.5 "Manrope", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app { height: 100%; display: grid; grid-template: "top top" auto "side list" 1fr / 240px 1fr; }

  header { grid-area: top; display: flex; align-items: center; gap: 10px; padding: 14px 20px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { margin: 0 8px 0 0; font: 600 11.5px/1 "Chakra Petch", system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  h1 b { color: var(--ember); font: 600 12px ui-monospace, monospace; letter-spacing: 0; margin-left: 6px; }
  .chips { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
  .chips button { border: 0; background: none; padding: 4px 10px; border-radius: 7px; color: var(--muted); font-size: 12.5px; }
  .chips button.on { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--ember); }
  .search { flex: 1; min-width: 140px; max-width: 320px; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); outline: none; }
  .search:focus, .add input:focus { border-color: var(--ember); box-shadow: 0 0 0 3px var(--ember-glow); }
  .tool { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
  .tool:hover { color: var(--ink); border-color: var(--ember); }
  .tool svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tool.busy svg { animation: spin 1s linear infinite; color: var(--ember); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spacer { flex: 1; }
  .status { font: 11px ui-monospace, monospace; color: var(--muted); }

  aside { grid-area: side; overflow-y: auto; padding: 12px 10px 20px; border-right: 1px solid var(--line); background: var(--surface); }
  aside h2 { margin: 6px 8px 8px; font: 600 10.5px/1 "Chakra Petch", system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .src { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 9px;
    border-left: 2px solid transparent; transition: background var(--dur, .2s), padding var(--dur, .2s); }
  .src:hover { background: var(--surface-2); }
  .src.on { background: var(--surface-2); border-left-color: var(--ember); }
  .src span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src small { font: 11px ui-monospace, monospace; color: var(--ember-soft); }
  .src.err small { color: var(--crit); }
  .src i { font-style: normal; color: var(--muted); font-size: 11px; }
  .add { display: grid; gap: 6px; margin: 14px 4px 0; }
  .add input { width: 100%; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--void); outline: none; font-size: 13px; }
  .add p { margin: 0; font-size: 11.5px; color: var(--muted); }
  .add p.err { color: var(--crit); }
  .hint { margin: 16px 8px 0; font-size: 11.5px; color: var(--muted); }
  .hint a { color: var(--ember-soft); cursor: pointer; text-decoration: underline dotted; }

  main { grid-area: list; overflow-y: auto; padding: 14px 20px 40px; }
  .items { list-style: none; margin: 0 auto; padding: 0; max-width: 820px; display: grid; gap: 8px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 14px; padding: 14px; border-radius: var(--r); background: var(--surface);
    border: 1px solid transparent; border-left: 2px solid var(--ember); transition: border-color var(--dur, .2s), opacity var(--dur, .2s), transform var(--dur, .2s) var(--spring, ease);
    animation: in var(--dur-slow, .4s) var(--ease, ease) both; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .item:hover { border-color: var(--line); border-left-color: var(--ember); }
  .item.read { border-left-color: var(--line); }
  .item.read .t { color: var(--silver); font-weight: 500; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; font: 11px ui-monospace, monospace; color: var(--muted); }
  .meta .site { color: var(--ember-soft); }
  .t { display: block; margin: 4px 0 4px; font-weight: 650; font-size: 15.5px; line-height: 1.35; color: var(--ink); text-decoration: none; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; }
  .t:hover { color: var(--ember-soft); }
  .sum { margin: 0; color: var(--silver); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .acts button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--ink); }
  .acts button:hover:not(:disabled) { border-color: var(--ember); color: var(--ember-soft); }
  .acts button:disabled { opacity: .55; cursor: default; }
  .acts .saved { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
  .thumb { width: 120px; height: 84px; border-radius: 9px; background: var(--surface-2); object-fit: cover; display: block; }
  .thumb.empty { visibility: hidden; }

  .empty-state { max-width: 560px; margin: 40px auto; text-align: center; color: var(--muted); }
  .empty-state h3 { margin: 0 0 6px; color: var(--ink); font: 600 16px "Chakra Petch", system-ui, sans-serif; }
  .sugs { display: grid; gap: 6px; margin-top: 18px; text-align: left; }
  .sug { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
  .sug div { flex: 1; min-width: 0; }
  .sug b { display: block; color: var(--ink); }
  .sug small { font: 11px ui-monospace, monospace; }
  .sug button, .primary { border: 0; border-radius: 9px; padding: 6px 12px; background: var(--ember); color: var(--on-ember); font-weight: 600; font-size: 12.5px; }
  .sug button:disabled { background: var(--surface-2); color: var(--muted); }

  .panel { position: fixed; z-index: 10; right: 16px; top: 58px; width: min(320px, calc(100vw - 32px)); padding: 16px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--line); box-shadow: 0 24px 50px -20px var(--shadow, #000), 0 0 0 1px var(--ember-glow); animation: in .2s ease both; }
  .panel h3 { margin: 0 0 12px; font: 600 11px/1 "Chakra Petch", system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .panel label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; font-size: 13px; }
  .panel select { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--void); }
  .panel input[type=checkbox] { accent-color: var(--ember); width: 16px; height: 16px; }
  .panel .danger { margin-top: 8px; border: 0; background: none; padding: 0; color: var(--muted); font-size: 12px; text-decoration: underline dotted; }
  .panel .danger:hover { color: var(--crit); }

  @media (max-width: 720px) {
    .app { grid-template: "top" auto "side" auto "list" 1fr / 1fr; }
    header { padding: 10px 14px 8px; }
    .search { order: 10; max-width: none; flex-basis: 100%; }
    aside { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; padding: 8px 10px; border-right: 0; border-bottom: 1px solid var(--line); scrollbar-width: none; }
    aside h2, .hint, .add p { display: none; }
    .src { width: auto; flex: none; border-left: 0; border-bottom: 2px solid transparent; border-radius: 8px; }
    .src.on { border-bottom-color: var(--ember); }
    .add { margin: 0; flex: none; }
    .add input { width: 180px; }
    main { padding: 10px 12px 30px; }
    .thumb { width: 84px; height: 64px; }
  }
  @media (prefers-reduced-motion: reduce) { .item, .panel { animation: none; } }
  :root[data-motion="parado"] .item, :root[data-motion="parado"] .panel { animation: none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Notícias<b id="count"></b></h1>
    <div class="chips" role="tablist">
      <button data-filter="novas" class="on">Não lidas</button>
      <button data-filter="todas">Todas</button>
      <button data-filter="salvas">Salvas</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Buscar nas notícias">
    <span class="spacer"></span>
    <span class="status" id="status"></span>
    <button class="tool" id="readall" title="Marcar tudo como lido" aria-label="Marcar tudo como lido">
      <svg viewBox="0 0 24 24"><path d="M2.5 12.5l4 4L15 8M10 16.5l1 1L21.5 7"/></svg>
    </button>
    <button class="tool" id="refresh" title="Atualizar agora" aria-label="Atualizar agora">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5"/></svg>
    </button>
    <button class="tool" id="settings" title="Ajustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
    </button>
  </header>
  <aside id="sources"></aside>
  <main id="main"></main>
</div>
<script>
(() => {
  'use strict';
  const t = window.tanden;
  const FONTES = 'Notícias/Fontes.md';
  const PASTA = 'Notícias';
  const MAX_POR_FONTE = 80;
  const MAX_LIDOS = 4000;
  const SUGESTOES = [
    { nome: 'Tecmundo', url: 'https://rss.tecmundo.com.br/feed', sobre: 'tecnologia, games' },
    { nome: 'g1 Tecnologia', url: 'https://g1.globo.com/rss/g1/tecnologia/', sobre: 'tecnologia' },
    { nome: 'BBC News Brasil', url: 'https://feeds.bbci.co.uk/portuguese/rss.xml', sobre: 'notícias gerais' },
    { nome: 'Hacker News', url: 'https://hnrss.org/frontpage', sobre: 'programação, em inglês' },
    { nome: 'The Verge', url: 'https://www.theverge.com/rss/index.xml', sobre: 'tecnologia, em inglês' },
    { nome: 'Ars Technica', url: 'https://feeds.arstechnica.com/arstechnica/index', sobre: 'ciência e tecnologia, em inglês' },
  ];

  // ---------------------------------------------------------------- estado
  const st = {
    fontes: [],            // [{ nome, url, avisar }]
    itens: {},             // url da fonte -> [item]
    erros: {},             // url da fonte -> mensagem
    lidos: new Set(),
    salvos: {},            // id do item -> caminho da nota
    config: { intervalo: 30, avisar: true },
    ultima: 0,
    filtro: 'novas',
    fonte: null,           // url da fonte selecionada (null = todas)
    busca: '',
    buscando: false,
    visivel: false,
    // lidas agora há pouco continuam na lista de não lidas até trocar de filtro
    fixos: new Set(),
  };
  const imagens = new Map(); // url -> data URL | '' (falhou)
  let timer = null;

  const $ = (id) => document.getElementById(id);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    return el;
  }

  const quando = (ms) => {
    if (!ms) return '';
    const d = Date.now() - ms;
    if (d < 60e3) return 'agora';
    if (d < 3600e3) return `${Math.floor(d / 60e3)} min`;
    if (d < 86400e3) return `${Math.floor(d / 3600e3)} h`;
    if (d < 7 * 86400e3) return `${Math.floor(d / 86400e3)} d`;
    return new Date(ms).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
  };
  const chave = (fonte, item) => `${fonte}#${item.id}`;
  const status = (s) => ($('status').textContent = s);

  // ------------------------------------------------- fontes (nota no cofre)
  const LINHA = /^\s*[-*]\s+(?:\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|<?(https?:\/\/[^\s>]+)>?)(.*)$/;
  function lerFontes(md) {
    const out = [];
    for (const line of (md || '').split('\n')) {
      const m = LINHA.exec(line);
      if (!m) continue;
      const url = m[2] || m[3];
      if (out.some((f) => f.url === url)) continue;
      out.push({ nome: (m[1] || '').trim() || new URL(url).hostname.replace(/^www\./, ''), url, avisar: !/#sem-aviso/.test(m[4] || '') });
    }
    return out;
  }
  function escreverFontes(fontes) {
    const linhas = fontes.map((f) => `- [${f.nome.replace(/[\[\]]/g, '')}](${f.url})${f.avisar ? '' : ' #sem-aviso'}`);
    return `---\ntipo: fontes-de-noticias\n---\n\n# Fontes de notícias\n\nUma fonte por linha, como \`- [Nome](endereço do feed ou do site)\`. Acrescente \`#sem-aviso\` no fim da linha para não receber notificações daquela fonte. O plugin Notícias lê esta nota; dá para editar aqui, no Obsidian ou pelo próprio plugin.\n\n${linhas.join('\n')}\n`;
  }
  async function carregarFontes() {
    try {
      st.fontes = lerFontes(await t.notas.ler(FONTES));
    } catch (e) {
      status(e.message);
    }
  }
  async function salvarFontes() {
    await t.notas.escrever(FONTES, escreverFontes(st.fontes));
  }

  // ------------------------------------------------------- dados guardados
  async function carregar() {
    const [itens, lidos, salvos, config, ultima] = await Promise.all(['itens', 'lidos', 'salvos', 'config', 'ultima'].map((k) => t.dados.ler(k)));
    st.itens = itens || {};
    st.lidos = new Set(lidos || []);
    st.salvos = salvos || {};
    st.config = Object.assign(st.config, config || {});
    st.ultima = ultima || 0;
  }
  let gravarTimer = null;
  function gravar() {
    clearTimeout(gravarTimer);
    gravarTimer = setTimeout(() => {
      const lidos = [...st.lidos].slice(-MAX_LIDOS);
      void t.dados.gravar('itens', st.itens);
      void t.dados.gravar('lidos', lidos);
      void t.dados.gravar('salvos', st.salvos);
      void t.dados.gravar('ultima', st.ultima);
    }, 300);
  }

  // ----------------------------------------------------------------- busca
  async function buscar({ avisar = true } = {}) {
    if (st.buscando) return;
    st.buscando = true;
    $('refresh').classList.add('busy');
    status('Atualizando…');
    await carregarFontes();
    const novos = [];
    let i = 0;
    const fila = [...st.fontes];
    const trabalhador = async () => {
      for (let f = fila.shift(); f; f = fila.shift()) {
        try {
          const r = await t.rede.feed(f.url);
          const antes = st.itens[f.url];
          const conhecidos = new Set((antes || []).map((x) => x.id));
          const itens = r.feed.itens
            .filter((x) => x.titulo)
            .map((x) => Object.assign(x, { visto: (antes || []).find((y) => y.id === x.id)?.visto || Date.now() }));
          // primeira busca de uma fonte: o que já existia não conta como novo
          if (antes) for (const x of itens) if (!conhecidos.has(x.id) && !st.lidos.has(chave(f.url, x))) novos.push({ f, x });
          // guarda também os antigos que saíram do feed, até o limite
          const fora = (antes || []).filter((y) => !itens.some((x) => x.id === y.id));
          st.itens[f.url] = [...itens, ...fora].sort((a, b) => (b.data || b.visto) - (a.data || a.visto)).slice(0, MAX_POR_FONTE);
          if (!antes) for (const x of st.itens[f.url].slice(10)) st.lidos.add(chave(f.url, x));
          delete st.erros[f.url];
          if (!f.nomeDoFeed && r.feed.titulo) f.nomeDoFeed = r.feed.titulo;
        } catch (e) {
          st.erros[f.url] = e.message;
        }
        status(`Atualizando… ${++i}/${st.fontes.length}`);
        render();
      }
    };
    await Promise.all([trabalhador(), trabalhador(), trabalhador()]);
    // fontes removidas da nota somem do cache
    for (const url of Object.keys(st.itens)) if (!st.fontes.some((f) => f.url === url)) delete st.itens[url];
    st.ultima = Date.now();
    st.buscando = false;
    $('refresh').classList.remove('busy');
    gravar();
    render();
    if (avisar && st.config.avisar) avisarNovos(novos.filter((n) => n.f.avisar));
    agendar();
  }

  function avisarNovos(novos) {
    if (!novos.length) return;
    const p = (n) => n.toLocaleString('pt-BR');
    if (novos.length === 1) {
      void t.avisos.notificar(novos[0].x.titulo, novos[0].f.nome).catch(() => {});
    } else {
      const fontes = [...new Set(novos.map((n) => n.f.nome))];
      const corpo = novos.slice(0, 3).map((n) => `• ${n.x.titulo}`).join('\n');
      void t.avisos.notificar(`${p(novos.length)} notícias novas`, `${corpo}${fontes.length > 1 ? `\n${fontes.slice(0, 3).join(', ')}` : ''}`).catch(() => {});
    }
  }

  function agendar() {
    clearTimeout(timer);
    if (!st.config.intervalo) return;
    const falta = Math.max(5_000, st.ultima + st.config.intervalo * 60_000 - Date.now());
    timer = setTimeout(() => void buscar(), falta);
  }

  // --------------------------------------------------------------- ações
  function marcar(fonte, item, lido = true) {
    const k = chave(fonte, item);
    if (lido) st.lidos.add(k); else st.lidos.delete(k);
    st.fixos.add(k);
    gravar();
    render();
  }

  async function salvar(fonte, item, btn) {
    btn.disabled = true;
    btn.textContent = 'Salvando…';
    try {
      const path = await t.notas.recortar(item.link, PASTA);
      if (!path) throw new Error('não deu para baixar a página');
      st.salvos[chave(fonte, item)] = path;
      st.lidos.add(chave(fonte, item));
      st.fixos.add(chave(fonte, item));
      gravar();
      render();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Tentar de novo';
      btn.title = e.message;
    }
  }

  async function adicionar(input, msg) {
    const raw = input.value.trim();
    if (!raw) return;
    const url = /^https?:\/\//i.test(raw) ? raw : `https://${raw}`;
    msg.className = '';
    msg.textContent = 'Procurando o feed…';
    try {
      const r = await t.rede.feed(url);
      if (st.fontes.some((f) => f.url === r.url)) throw new Error('essa fonte já está na lista');
      const nome = r.feed.titulo || new URL(r.url).hostname.replace(/^www\./, '');
      await carregarFontes();
      st.fontes.push({ nome: nome.slice(0, 60), url: r.url, avisar: true });
      await salvarFontes();
      input.value = '';
      msg.textContent = `${nome} adicionada.`;
      st.fonte = r.url;
      await buscar({ avisar: false });
    } catch (e) {
      msg.className = 'err';
      msg.textContent = e.message;
    }
  }

  async function adicionarSugestao(s, btn) {
    btn.disabled = true;
    btn.textContent = '…';
    await carregarFontes();
    if (!st.fontes.some((f) => f.url === s.url)) st.fontes.push({ nome: s.nome, url: s.url, avisar: true });
    await salvarFontes();
    btn.textContent = 'Adicionada';
    await buscar({ avisar: false });
  }

  async function removerFonte(f) {
    await carregarFontes();
    st.fontes = st.fontes.filter((x) => x.url !== f.url);
    await salvarFontes();
    delete st.itens[f.url];
    if (st.fonte === f.url) st.fonte = null;
    gravar();
    render();
  }

  // ---------------------------------------------------------------- tela
  function todos() {
    const out = [];
    for (const f of st.fontes) for (const x of st.itens[f.url] || []) out.push({ f, x, k: chave(f.url, x) });
    return out.sort((a, b) => (b.x.data || b.x.visto) - (a.x.data || a.x.visto));
  }

  function naoLidos(url) {
    let n = 0;
    for (const f of st.fontes) if (!url || f.url === url) for (const x of st.itens[f.url] || []) if (!st.lidos.has(chave(f.url, x))) n++;
    return n;
  }

  const imgQueue = [];
  let imgRunning = 0;
  const observer = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      observer.unobserve(e.target);
      imgQueue.push(e.target);
      pump();
    }
  }, { rootMargin: '300px' });
  function pump() {
    while (imgRunning < 3 && imgQueue.length) {
      const el = imgQueue.shift();
      const url = el.dataset.src;
      if (imagens.has(url)) { show(el, imagens.get(url)); continue; }
      imgRunning++;
      t.rede.imagem(url).then((d) => { imagens.set(url, d); show(el, d); }, () => { imagens.set(url, ''); show(el, ''); }).finally(() => { imgRunning--; pump(); });
    }
  }
  function show(el, data) {
    if (data) { el.src = data; el.classList.remove('empty'); } else el.remove();
  }

  function renderFontes() {
    const side = $('sources');
    side.replaceChildren();
    side.append(h('h2', {}, 'Fontes'));
    const all = naoLidos();
    side.append(h('button', { class: `src${st.fonte === null ? ' on' : ''}`, onclick: () => { st.fonte = null; st.fixos.clear(); render(); } }, h('span', {}, 'Todas'), all ? h('small', {}, all) : null));
    for (const f of st.fontes) {
      const n = naoLidos(f.url);
      const err = st.erros[f.url];
      side.append(h('button', {
        class: `src${st.fonte === f.url ? ' on' : ''}${err ? ' err' : ''}`,
        title: err ? `Erro: ${err}` : f.url,
        onclick: () => { st.fonte = f.url; st.fixos.clear(); render(); },
      }, h('span', {}, f.nome), err ? h('small', {}, '!') : n ? h('small', {}, n) : null, f.avisar ? null : h('i', { title: 'sem notificações' }, '◌')));
    }
    const input = h('input', { placeholder: 'Adicionar: site ou feed', type: 'url', 'aria-label': 'Endereço do site ou do feed' });
    const msg = h('p', {}, 'Cole o endereço de um site: o feed dele é encontrado sozinho.');
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') void adicionar(input, msg); });
    side.append(h('div', { class: 'add' }, input, msg));
    side.append(h('p', { class: 'hint' }, 'As fontes ficam na nota ', h('a', { onclick: () => void t.app.abrirNota(FONTES).catch(() => {}) }, FONTES), '.'));
  }

  function renderLista() {
    const main = $('main');
    main.replaceChildren();
    if (!st.fontes.length) {
      main.append(h('div', { class: 'empty-state' },
        h('h3', {}, 'Nenhuma fonte ainda'),
        h('p', {}, 'Adicione um site na coluna ao lado ou comece com uma destas:'),
        h('div', { class: 'sugs' }, SUGESTOES.map((s) => {
          const btn = h('button', { onclick: () => void adicionarSugestao(s, btn) }, 'Adicionar');
          return h('div', { class: 'sug' }, h('div', {}, h('b', {}, s.nome), h('small', {}, s.sobre)), btn);
        }))));
      return;
    }
    const q = st.busca.toLowerCase();
    const lista = todos().filter(({ f, x, k }) =>
      (!st.fonte || f.url === st.fonte) &&
      (st.filtro === 'todas' || (st.filtro === 'novas' && (!st.lidos.has(k) || st.fixos.has(k))) || (st.filtro === 'salvas' && st.salvos[k])) &&
      (!q || x.titulo.toLowerCase().includes(q) || x.resumo.toLowerCase().includes(q)));
    if (!lista.length) {
      const err = st.fonte && st.erros[st.fonte];
      main.append(h('div', { class: 'empty-state' },
        h('h3', {}, err ? 'Não consegui ler esta fonte' : st.filtro === 'novas' ? 'Tudo lido por aqui' : 'Nada encontrado'),
        h('p', {}, err || (st.filtro === 'novas' ? 'Quando chegar notícia nova, ela aparece aqui.' : '')),
        st.fonte ? h('p', {}, h('button', { class: 'primary', onclick: () => { const f = st.fontes.find((x) => x.url === st.fonte); if (f && confirm(`Remover ${f.nome} das fontes?`)) void removerFonte(f); } }, 'Remover esta fonte')) : null));
      return;
    }
    const ul = h('ul', { class: 'items' });
    for (const { f, x, k } of lista.slice(0, 300)) {
      const lido = st.lidos.has(k);
      const salvo = st.salvos[k];
      const abrir = () => { if (x.link) void t.app.abrirLink(x.link); marcar(f.url, x, true); };
      const salvarBtn = salvo
        ? h('button', { class: 'saved', onclick: () => void t.app.abrirNota(salvo).catch(() => {}) }, 'Salva ✓ abrir nota')
        : h('button', { onclick: (e) => void salvar(f.url, x, e.currentTarget), disabled: !x.link }, 'Salvar como nota');
      const thumb = x.imagem ? h('img', { class: 'thumb empty', alt: '', 'data-src': x.imagem }) : null;
      ul.append(h('li', { class: `item${lido ? ' read' : ''}` },
        h('div', {},
          h('div', { class: 'meta' }, h('span', { class: 'site' }, f.nome), x.data || x.visto ? h('time', {}, quando(x.data || x.visto)) : null, x.autor ? h('span', {}, x.autor) : null),
          h('button', { class: 't', onclick: abrir, title: x.link }, x.titulo),
          x.resumo ? h('p', { class: 'sum' }, x.resumo) : null,
          h('div', { class: 'acts' },
            h('button', { onclick: abrir, disabled: !x.link }, 'Ler no site'),
            salvarBtn,
            h('button', { onclick: () => marcar(f.url, x, !lido) }, lido ? 'Marcar como não lida' : 'Marcar como lida'))),
        thumb));
      if (thumb) observer.observe(thumb);
    }
    main.append(ul);
  }

  function render() {
    const n = naoLidos();
    $('count').textContent = n ? String(n) : '';
    void t.app.selo(n).catch(() => {});
    if (!st.buscando) status(st.ultima ? `Atualizado ${quando(st.ultima) === 'agora' ? 'agora' : `há ${quando(st.ultima)}`}` : '');
    for (const b of document.querySelectorAll('[data-filter]')) b.classList.toggle('on', b.dataset.filter === st.filtro);
    renderFontes();
    if (st.visivel || !document.querySelector('.items, .empty-state')) renderLista();
  }

  function ajustes() {
    const old = document.querySelector('.panel');
    if (old) { old.remove(); return; }
    const sel = h('select', {}, [[15, '15 minutos'], [30, '30 minutos'], [60, '1 hora'], [180, '3 horas'], [0, 'Só à mão']].map(([v, l]) =>
      h('option', { value: v, selected: st.config.intervalo === v }, l)));
    sel.addEventListener('change', () => { st.config.intervalo = Number(sel.value); void t.dados.gravar('config', st.config); agendar(); });
    const chk = h('input', { type: 'checkbox', checked: st.config.avisar });
    chk.addEventListener('change', () => { st.config.avisar = chk.checked; void t.dados.gravar('config', st.config); });
    const panel = h('div', { class: 'panel', role: 'dialog' },
      h('h3', {}, 'Ajustes'),
      h('label', {}, 'Buscar notícias a cada', sel),
      h('label', {}, 'Avisar quando chegar notícia nova', chk),
      h('button', { class: 'danger', onclick: () => { for (const k of Object.keys(st.salvos)) delete st.salvos[k]; gravar(); render(); panel.remove(); } }, 'Esquecer a lista de salvas (as notas continuam)'));
    document.body.append(panel);
  }

  // --------------------------------------------------------------- início
  for (const b of document.querySelectorAll('[data-filter]')) b.addEventListener('click', () => { st.filtro = b.dataset.filter; st.fixos.clear(); render(); });
  $('search').addEventListener('input', (e) => { st.busca = e.target.value; renderLista(); });
  $('refresh').addEventListener('click', () => void buscar());
  $('settings').addEventListener('click', ajustes);
  $('readall').addEventListener('click', () => {
    for (const { f, x } of todos()) if (!st.fonte || f.url === st.fonte) st.lidos.add(chave(f.url, x));
    gravar();
    render();
  });
  document.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLInputElement) return;
    if (e.key === 'r') void buscar();
    if (e.key === '/') { e.preventDefault(); $('search').focus(); }
  });
  t.aoMostrar((on) => {
    st.visivel = on;
    if (on) {
      render();
      // voltou para a tela depois de um tempo: confere se há novidades
      if (Date.now() - st.ultima > 5 * 60_000) void buscar();
    }
  });

  (async () => {
    await carregar();
    await carregarFontes();
    render();
    if (Date.now() - st.ultima > Math.max(st.config.intervalo, 5) * 60_000) await buscar({ avisar: !!st.ultima });
    else agendar();
  })().catch((e) => status(e.message));
})();
</script>
</body>
</html>
