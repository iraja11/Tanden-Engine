[package]
name = "tanden"
version = "0.1.0"
description = "Tanden Engine"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tanden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
